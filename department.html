<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gazva — Departments</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .depts-page { padding: 3rem 2rem 5rem; background: var(--off-white); }
    .dept-block { max-width: 1100px; margin: 0 auto 2.5rem; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .dept-header { padding: 1.75rem 2rem; background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid)); display: flex; align-items: center; gap: 1rem; }
    .dept-title { font-family: 'Playfair Display', serif; color: white; font-size: 1.3rem; font-weight: 600; }
    .dept-body { padding: 2rem; }
    .dept-members-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.25rem; }
    .member-card { background: var(--off-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 0.75rem; text-align: center; transition: all 0.3s ease; }
    .member-card:hover { background: var(--white); box-shadow: 0 8px 24px rgba(10,42,92,0.1); transform: translateY(-3px); border-color: var(--blue-pale); }
    .member-avatar { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 0.75rem; overflow: hidden; background: var(--blue-ghost); border: 2px solid var(--blue-pale); display: flex; align-items: center; justify-content: center; }
    .member-avatar svg { width: 34px; height: 34px; color: var(--blue-light); opacity: 0.6; }
    .member-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .member-name { font-size: 0.82rem; font-weight: 600; color: var(--blue-deep); margin-bottom: 0.25rem; }
    .member-pos { font-size: 0.7rem; color: var(--blue-light); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
    @media (max-width: 768px) { .dept-members-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 480px) { .dept-members-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

<main>

  <div class="page-banner">
    <h1>Departments</h1>
    <p>Academic wings of Gazva — leading departmental excellence</p>
    <div class="breadcrumb">
      <a href="home.html">Home</a><span>/</span><span>Departments</span>
    </div>
  </div>

  <div class="depts-page">
    <div id="dept-blocks">
      <p class="loading-note">Loading departments…</p>
    </div>
  </div><!-- /depts-page -->

</main>

<script src="api.js"></script>
<script src="components.js"></script>
<script src="main.js"></script>
<script>
  (function () {
    const container = document.getElementById('dept-blocks');

    function memberCardHTML(m) {
      const img = m.image_url
        ? `<img src="${gazvaEscapeHTML(m.image_url)}" alt="${gazvaEscapeHTML(m.name)}" onerror="this.style.display='none'"/>`
        : gazvaAvatarSVG();
      return `
        <div class="member-card">
          <div class="member-avatar">${img}</div>
          <div class="member-name">${gazvaEscapeHTML(m.name)}</div>
          <div class="member-pos">${gazvaEscapeHTML(m.role)}</div>
        </div>`;
    }

    function deptBlockHTML(groupName, members) {
      return `
        <div class="dept-block fade-up">
          <div class="dept-header"><div class="dept-title">${gazvaEscapeHTML(groupName)}</div></div>
          <div class="dept-body">
            <div class="dept-members-grid">${members.map(memberCardHTML).join('')}</div>
          </div>
        </div>`;
    }

    GazvaAPI.getMembers('department')
      .then((members) => {
        if (!members.length) {
          container.innerHTML = '<p class="loading-note">Departments will appear here once added in the admin panel.</p>';
          return;
        }
        const groups = GazvaAPI.groupBy(members, 'group_name');
        container.innerHTML = Object.keys(groups).map((g) => deptBlockHTML(g, groups[g])).join('');
        document.querySelectorAll('.fade-up').forEach((el) => el.classList.add('visible'));
      })
      .catch((err) => {
        container.innerHTML = `<p class="loading-note">Couldn't load departments (${gazvaEscapeHTML(err.message)}).</p>`;
      });
  })();
</script>
</body>
</html>
