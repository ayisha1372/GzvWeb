<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gazva — Wings of Gazva</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<main>

  <div class="wings-org-hero">
    <p class="wings-eyebrow">Wings of Gazva</p>
    <h1>Seven wings. One union. One vision.</h1>
    <p class="wings-tagline">Explore how Gazva is organized — from each wing's leadership down to every club and forum beneath it.</p>
  </div>

  <div class="wings-org-section">
    <div class="wings-stage" id="wingsStage">

      <!-- ===== GRID VIEW: the 7 main wings ===== -->
      <div class="wings-org-grid" id="wingsGrid" role="list" aria-label="Main wings of Gazva"></div>

      <!-- ===== DETAIL VIEW: expanded wing profile ===== -->
      <div class="wing-detail" id="wingDetail" hidden></div>

    </div>
  </div>

</main>

<script src="api.js"></script>
<script src="components.js"></script>
<script src="main.js"></script>
<script>
(function () {
  'use strict';

  // ===========================================================
  // 1. THE OFFICIAL STRUCTURE — data-driven, easy to edit later.
  //    Names/leadership slots/sub-units are defined here exactly
  //    as supplied. Actual people (name, role, photo) are pulled
  //    live from the admin panel via GazvaAPI and matched in.
  // ===========================================================
  const WINGS = [
    {
      id: 1,
      name: 'Organizing Committee',
      purpose: 'Coordinating and facilitating the major activities and initiatives of the union.',
      leaderRoles: ['Chairperson', 'Convener', 'Convener'],
      subUnits: [],
    },
    {
      id: 2,
      name: 'Islamic Information Cell',
      purpose: 'Spreading authentic Islamic knowledge and awareness across campus.',
      leaderRoles: ['Chairperson', 'Convener', 'Convener'],
      subUnits: [],
    },
    {
      id: 3,
      name: 'Prasanga Kala Vedi',
      purpose: "Nurturing the art of public speaking and oratory among students.",
      leaderRoles: ['Chairperson', 'Convener', 'Convener'],
      subUnits: [
        { name: "Speaker's Forum", roles: ['General Secretary', 'Joint Secretary'] },
      ],
    },
    {
      id: 4,
      name: 'Media Wing',
      purpose: 'Capturing and communicating the story of Gazva across every platform.',
      leaderRoles: ['Chairperson', 'Convener', 'Convener'],
      subUnits: [],
    },
    {
      id: 5,
      name: 'Editorial Board',
      purpose: "Shaping Gazva's publications and giving student voices a platform in print.",
      leaderRoles: ['Chairperson', 'Convener', 'Convener'],
      subUnits: [],
    },
    {
      id: 6,
      name: 'Gazva Debate',
      purpose: 'Championing the art of argument through structured, competitive debate.',
      leaderRoles: ['Chairperson'],
      subUnits: [
        { name: 'Nadi Munazara', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Urdu Debate', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'British Parliamentary', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Samvata Samiti', roles: ['General Secretary', 'Joint Secretary'] },
      ],
    },
    {
      id: 7,
      name: 'SRDP',
      purpose: 'Driving student research and development across every discipline.',
      leaderRoles: ['Chairperson', 'Convener', 'Convener'],
      subUnits: [
        { name: 'English Club', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Malayalam Club', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Urdu Club', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Arabic Club', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Science and Maths Club', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Translation Club', roles: ['General Secretary', 'Joint Secretary'] },
        { name: 'Art Club', roles: ['General Secretary', 'Joint Secretary'] },
      ],
    },
  ];

  const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
  const BACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
  const PERSON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>';

  const grid = document.getElementById('wingsGrid');
  const detail = document.getElementById('wingDetail');

  // All wing members, fetched once and matched against the WINGS structure.
  let allMembers = [];
  const membersReady = GazvaAPI.getMembers('wing')
    .then((members) => { allMembers = members; })
    .catch((err) => { console.error("Couldn't load wing members:", err.message); });

  // ===========================================================
  // 2. Helpers to pull real people out of the API data for a
  //    given wing / sub-unit, in role order, filling empty slots
  //    with a placeholder if that position hasn't been filled yet.
  // ===========================================================
  function membersFor(wingName, subgroup) {
    return allMembers.filter((m) => m.group_name === wingName && (m.subgroup || null) === (subgroup || null));
  }

  function slotsForRoles(pool, roles) {
    const used = new Set();
    return roles.map((role) => {
      const match = pool.find((m) => !used.has(m.id) && (m.role || '').toLowerCase() === role.toLowerCase());
      if (match) used.add(match.id);
      return match || { name: null, role, image_url: null };
    });
  }

  function profileHTML(person) {
    const isPlaceholder = !person.name || person.name === 'Add member name';
    const img = person.image_url
      ? `<img src="${gazvaEscapeHTML(person.image_url)}" alt="${gazvaEscapeHTML(person.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>`
      : '';
    return `
      <div class="org-profile">
        <div class="org-profile-photo${isPlaceholder ? ' empty-slot' : ''}">
          ${img}
          <div style="${person.image_url ? 'display:none' : ''}">${PERSON_SVG}</div>
        </div>
        <div class="org-profile-name${isPlaceholder ? ' placeholder' : ''}">${isPlaceholder ? 'Position open' : gazvaEscapeHTML(person.name)}</div>
        <div class="org-profile-role">${gazvaEscapeHTML(person.role)}</div>
      </div>`;
  }

  // ===========================================================
  // 3. GRID VIEW — the 7 main wing cards
  // ===========================================================
  function renderGrid() {
    grid.innerHTML = WINGS.map(
      (w) => `
      <button type="button" class="wing-org-card fade-up visible" role="listitem" data-wing-id="${w.id}" aria-label="Explore ${gazvaEscapeHTML(w.name)}">
        <span class="wing-org-number">${String(w.id).padStart(2, '0')}</span>
        <h2 class="wing-org-name">${gazvaEscapeHTML(w.name.toUpperCase())}</h2>
        <p class="wing-org-purpose">${gazvaEscapeHTML(w.purpose)}</p>
        <span class="wing-org-explore">Explore ${ARROW_SVG}</span>
      </button>`
    ).join('');
  }

  // ===========================================================
  // 4. DETAIL VIEW — a wing's leadership + its sub-units
  // ===========================================================
  function renderWingDetail(wing) {
    const leaders = slotsForRoles(membersFor(wing.name, null), wing.leaderRoles);

    const subUnitsHTML = wing.subUnits.length
      ? `
        <div class="wing-subunits-wrap">
          <div class="wing-subunits-divider"></div>
          <p class="wing-section-label">Under ${gazvaEscapeHTML(wing.name)}</p>
          <div class="wing-subunits-grid" id="subunitsGrid">
            ${wing.subUnits
              .map(
                (su, i) => `
              <button type="button" class="subunit-card" data-subunit-index="${i}" aria-label="View ${gazvaEscapeHTML(su.name)} leadership">
                <div class="subunit-card-name">${gazvaEscapeHTML(su.name.toUpperCase())}</div>
                <span class="subunit-card-view">View team ${ARROW_SVG}</span>
              </button>`
              )
              .join('')}
          </div>
          <div id="subunitDetailWrap"></div>
        </div>`
      : '';

    detail.innerHTML = `
      <div class="wing-detail-top">
        <button type="button" class="wing-back" id="wingBackBtn">${BACK_SVG} Back</button>
        <span class="wing-detail-count">${String(wing.id).padStart(2, '0')} / 07</span>
      </div>
      <div class="wing-detail-heading">
        <h2>${gazvaEscapeHTML(wing.name.toUpperCase())}</h2>
        <p>${gazvaEscapeHTML(wing.purpose)}</p>
      </div>
      <p class="wing-section-label">Wing Leadership</p>
      <div class="wing-leaders-row count-${leaders.length}">
        ${leaders.map(profileHTML).join('')}
      </div>
      ${subUnitsHTML}
    `;

    document.getElementById('wingBackBtn').addEventListener('click', closeDetail);

    // Sub-unit cards -> reveal that sub-unit's leadership in place
    detail.querySelectorAll('[data-subunit-index]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const su = wing.subUnits[Number(btn.dataset.subunitIndex)];
        renderSubUnitDetail(wing, su);
      });
    });
  }

  function renderSubUnitDetail(wing, subUnit) {
    const subGrid = document.getElementById('subunitsGrid');
    const wrap = document.getElementById('subunitDetailWrap');
    const people = slotsForRoles(membersFor(wing.name, subUnit.name), subUnit.roles);

    subGrid.style.display = 'none';

    wrap.innerHTML = `
      <div class="subunit-detail">
        <button type="button" class="subunit-detail-back" id="subunitBackBtn">${BACK_SVG} Back to ${gazvaEscapeHTML(wing.name)}</button>
        <div class="subunit-detail-heading">
          <h3>${gazvaEscapeHTML(subUnit.name.toUpperCase())}</h3>
          <p>A sub-unit under ${gazvaEscapeHTML(wing.name.toUpperCase())}</p>
        </div>
        <div class="wing-leaders-row count-${people.length}">
          ${people.map(profileHTML).join('')}
        </div>
      </div>`;

    document.getElementById('subunitBackBtn').addEventListener('click', () => {
      wrap.innerHTML = '';
      subGrid.style.display = '';
    });

    wrap.querySelector('.subunit-detail-back').focus();
  }

  // ===========================================================
  // 5. Grid <-> Detail transitions (no page navigation)
  // ===========================================================
  function openDetail(wingId) {
    const wing = WINGS.find((w) => w.id === wingId);
    if (!wing) return;
    grid.setAttribute('data-dimmed', 'true');
    detail.hidden = false;
    detail.innerHTML = '<p class="loading-note">Loading wing profile…</p>';
    window.scrollTo({ top: detail.offsetTop - 24, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    membersReady.then(() => {
      renderWingDetail(wing);
      const backBtn = document.getElementById('wingBackBtn');
      if (backBtn) backBtn.focus();
    });
  }

  function closeDetail() {
    detail.hidden = true;
    detail.innerHTML = '';
    grid.removeAttribute('data-dimmed');
  }

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('[data-wing-id]');
    if (card) openDetail(Number(card.dataset.wingId));
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !detail.hidden) closeDetail();
  });

  // ===========================================================
  // 6. Boot: render the grid immediately; member data loads
  //    in the background via membersReady (see above).
  // ===========================================================
  renderGrid();

})();
</script>
</body>
</html>
